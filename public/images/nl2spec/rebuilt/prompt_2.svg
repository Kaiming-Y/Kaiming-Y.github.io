<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64768a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="58" y="70" fill="#203449" font-family="Arial, sans-serif" font-size="40" font-weight="650" text-anchor="start">Method 2 · Prompt anatomy</text><text x="60" y="108" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">A readable guide to the prompt structure, not a replacement for the source prompt</text><path d="M60 135 L1440 135" fill="none" stroke="#d9e3eb" stroke-width="2.5"/><rect x="60" y="177" width="648" height="790" rx="15" fill="#fafcfd" stroke="#d9e3eb" stroke-width="2"/><rect x="742" y="177" width="698" height="790" rx="15" fill="#fff" stroke="#d9e3eb" stroke-width="2"/><text x="87" y="222" fill="#203449" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Context &amp; demonstrations</text><text x="770" y="222" fill="#203449" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Runtime task &amp; response</text><text x="87" y="277" fill="#188c88" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">01  Role</text><text x="87" y="316.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Linear temporal logic expert</text><text x="87" y="392" fill="#188c88" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">02  Instruction</text><text x="87" y="431.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Infer a target relationship from two LTL</text><text x="87" y="464.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">formulas; express the result as LTL.</text><text x="87" y="578" fill="#188c88" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">03  Few-shot examples</text><text x="87" y="619.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Source example: G(A → F B) and G(B → F C),</text><text x="87" y="652.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">with target entities A and C.</text><rect x="88" y="746" width="590" height="105" rx="12" fill="#f7f5fb" stroke="#d8cfea" stroke-width="2"/><text x="104" y="775" fill="#8265aa" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Example output from the source</text><text x="383.0" y="818" fill="#8265aa" font-family="Menlo, monospace" font-size="23" font-weight="500" text-anchor="middle">G(A → F C)</text><text x="770" y="277" fill="#3568a8" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">04  Input template</text><text x="770" y="333" fill="#203449" font-family="Menlo, monospace" font-size="23" font-weight="400" text-anchor="start">LTL formula 1: {ltl1}</text><text x="770" y="375" fill="#203449" font-family="Menlo, monospace" font-size="23" font-weight="400" text-anchor="start">LTL formula 2: {ltl2}</text><text x="770" y="417" fill="#203449" font-family="Menlo, monospace" font-size="23" font-weight="400" text-anchor="start">Target pair: {entity1}, {entity2}</text><path d="M770 467 L1410 467" fill="none" stroke="#d9e3eb" stroke-width="2.5"/><text x="770" y="517" fill="#8265aa" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">05  Output fields</text><text x="770" y="573" fill="#8265aa" font-family="Menlo, monospace" font-size="24" font-weight="500" text-anchor="start">The relationship expressed</text><text x="770" y="616" fill="#8265aa" font-family="Menlo, monospace" font-size="24" font-weight="500" text-anchor="start">by the LTL formula:</text><text x="770" y="659" fill="#8265aa" font-family="Menlo, monospace" font-size="24" font-weight="500" text-anchor="start">Explanation:</text><text x="770" y="798" fill="#203449" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">Reading the result</text><text x="770" y="840.0" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Inspect both the proposed relation and its</text><text x="770" y="870.0" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">assumptions; fluent explanations do not</text><text x="770" y="900.0" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">establish entailment.</text><text x="60" y="1054" fill="#64768a" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Condensed visualization of the repository prompt · Original prompt text remains unchanged</text></svg>