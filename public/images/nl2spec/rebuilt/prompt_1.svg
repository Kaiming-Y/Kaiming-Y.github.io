<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64768a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="58" y="70" fill="#203449" font-family="Arial, sans-serif" font-size="40" font-weight="650" text-anchor="start">Method 1 · Prompt anatomy</text><text x="60" y="108" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">A readable guide to the prompt structure, not a replacement for the source prompt</text><path d="M60 135 L1440 135" fill="none" stroke="#d9e3eb" stroke-width="2.5"/><rect x="60" y="177" width="648" height="790" rx="15" fill="#fafcfd" stroke="#d9e3eb" stroke-width="2"/><rect x="742" y="177" width="698" height="790" rx="15" fill="#fff" stroke="#d9e3eb" stroke-width="2"/><text x="87" y="222" fill="#203449" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Context &amp; demonstrations</text><text x="770" y="222" fill="#203449" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Runtime task &amp; response</text><text x="87" y="277" fill="#188c88" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">01  Role</text><text x="87" y="316.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Natural-language reasoning expert</text><text x="87" y="392" fill="#188c88" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">02  Instruction</text><text x="87" y="431.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Infer the relation between two target entities</text><text x="87" y="464.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">from two sentences; express it in natural</text><text x="87" y="497.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">language.</text><text x="87" y="578" fill="#188c88" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">03  Few-shot examples</text><text x="87" y="619.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">The source includes paired sentences, a</text><text x="87" y="652.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">requested entity pair, a proposed relation</text><text x="87" y="685.0" fill="#203449" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">and an explanation.</text><text x="87" y="776.0" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Examples are demonstrations, not</text><text x="87" y="806.0" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">correctness guarantees. Audit their</text><text x="87" y="836.0" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">assumptions before reuse.</text><text x="770" y="277" fill="#3568a8" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">04  Input template</text><text x="770" y="333" fill="#203449" font-family="Menlo, monospace" font-size="23" font-weight="400" text-anchor="start">Sentence 1: {nl1}</text><text x="770" y="375" fill="#203449" font-family="Menlo, monospace" font-size="23" font-weight="400" text-anchor="start">Sentence 2: {nl2}</text><text x="770" y="417" fill="#203449" font-family="Menlo, monospace" font-size="23" font-weight="400" text-anchor="start">Target pair: {entity1}, {entity2}</text><path d="M770 467 L1410 467" fill="none" stroke="#d9e3eb" stroke-width="2.5"/><text x="770" y="517" fill="#8265aa" font-family="Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start">05  Output fields</text><text x="770" y="573" fill="#8265aa" font-family="Menlo, monospace" font-size="24" font-weight="500" text-anchor="start">Hidden Relationship:</text><text x="770" y="616" fill="#8265aa" font-family="Menlo, monospace" font-size="24" font-weight="500" text-anchor="start">Explanation:</text><text x="770" y="798" fill="#203449" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">Reading the result</text><text x="770" y="840.0" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Inspect both the proposed relation and its</text><text x="770" y="870.0" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">assumptions; fluent explanations do not</text><text x="770" y="900.0" fill="#64768a" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">establish entailment.</text><text x="60" y="1054" fill="#64768a" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Condensed visualization of the repository prompt · Original prompt text remains unchanged</text></svg>